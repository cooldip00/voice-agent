customer = 1
goal = "Rahul goes quiet for 20 s after the amount: the bot checks he is still there"

[[reply]]
when = "am i speaking|speaking (with|to)"
say = "Yes, this is Rahul speaking."

[[reply]]
when = "anything else"
say = "No, that's all. Thank you."

[[reply]]
when = "date of birth|born"
say = "It's the fifth of March, nineteen ninety."

[[reply]]
when = "is that (right|correct|okay|ok)|confirm\\b|shall i|should i|still there|are you there|hello"
