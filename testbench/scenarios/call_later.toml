customer = 5
goal = "Vikram is driving: the bot books a callback at the time he names"

[[reply]]
when = "am i speaking|speaking (with|to)"
say = "Yes, speaking, but I'm driving right now. Can you call me tomorrow at eleven in the morning?"

[[reply]]
when = "anything else"
say = "No. Bye."
hang_up = true

[[reply]]
when = "what time|which time|when (would|should|can|could|is a good)|good time|convenient"
say = "Tomorrow at eleven in the morning."

[[reply]]
when = "date of birth|born"
say = "The ninth of September, nineteen seventy nine."

[[reply]]
when = "is that (right|correct|okay|ok)|confirm\\b|shall i|should i"
say = "Yes, that's fine."

[[reply]]
when = "scheduled|we will call you|we'll call you|call you back"
say = "Okay, thanks. Bye."
hang_up = true

[expect]
outcome = "callback"
callback = "tomorrow 11:00"
